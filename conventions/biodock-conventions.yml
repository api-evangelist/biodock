  see: authentication/biodock-authentication.yml
base_url: https://app.biodock.ai/api/external
content_type: application/json
media:
  json_requests: true
  multipart_upload: true   # POST /filesystem-items/upload-file uses multipart/form-data
pagination:
  style: cursor
  request_params:
    limit: Maximum number of results to show.
    startingAfter: Pagination cursor id (id of the last item on the previous page).
  response_fields:
    results: Array of items on the current page.
    count: Number of items returned on the current page.
