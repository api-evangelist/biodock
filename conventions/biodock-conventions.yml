idempotency:
  supported: false
  note: >-
    No idempotency key or de-duplication contract is documented. Submitting an
    analysis job or uploading a file twice creates two records.
async_jobs:
  pattern: submit-then-poll
  note: >-
    Analysis jobs and mask-generation jobs are asynchronous. Submit returns a
    job with status/percentageCompleted; poll the fetch endpoint until status is
    SUCCEEDED to obtain the result/download URLs.
  statuses: [PENDING, SUBMITTED, RUNNING, SUCCEEDED, FAILED]
  result_urls:
  - objectsDataCSVUrl
  - aggregateDataCSVUrl
  - masksZipUrl
identifiers:
  type_discriminator: __t
  note: Filesystem items carry a __t discriminator field (File or Folder).
versioning:
  scheme: none-documented
  status: beta
  note: API is in beta; resources may change. No version path segment or version header is documented.
  see: lifecycle/biodock-lifecycle.yml
error_envelope:
  documented: false
  note: >-
    The docs publish 200 success shapes only; an explicit error catalog / error
    envelope is not documented. checkApiKey implies a 401 on an invalid key.
rate_limiting:
  documented_headers: none
  note: >-
    No rate-limit response headers are documented. Usage is governed by account
