aid: biodock
name: Biodock
description: >-
  Biodock is an AI platform that makes deep learning easy to train, run, and
  interpret on biological and microscopy images, dramatically accelerating R&D
  image analysis. Researchers upload microscopy images, label and train
  fully-automated deep AI models in a visual labeler (no code required), and run
  those models across large datasets to segment, classify, and quantify objects
  such as cells - producing results comparable to flow cytometry along with
  downloadable object-level and aggregate data. Biodock is used by academic labs
  and Fortune 500 biopharma and life-science organizations, and is SOC 2 Type II
  and ISO 27001 certified. Beyond the visual app, Biodock exposes a public REST
  API (beta) for uploading files to the Biodock Filesystem, submitting analysis
  jobs against published pipelines, tracking job progress, and downloading
  results and segmentation masks - so analysis can be scripted and integrated
  into internal tools and imaging pipelines.
